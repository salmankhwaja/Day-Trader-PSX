name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (offline, standard library only)
        run: python -m unittest discover -v tests
      - name: Shell scripts parse
        run: bash -n psx-mufap/scripts/daily_sync.sh && bash -n psx-mufap/scripts/install_services.sh
