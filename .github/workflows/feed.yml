name: feed
# The website's price feed (tools/web_feed.py): PSX market watch (every share in one request), the
# KSE-100, dividends, company pages and MUFAP, published ENCRYPTED in feed/ with the PSX_DATA_KEY
# secret. PK Wealth on the same GitHub Pages site reads feed/latest.enc.json too.
#
# WHEN AND HOW IT RUNS: edit feed-settings.json, not this file. Times, days, what to fetch, timeouts,
# budgets and an on/off switch all live there. GitHub can't read schedule times from a file, so a
# small "plan" job wakes every 30 minutes, reads feed-settings.json (tools/feed_plan.py) and starts
# the fetch only when one of your times has come; each scheduled time runs once (remembered in the
# Actions cache), and one GitHub delayed or dropped still runs within catch_up_hours.
#
# Cost: nothing on a public repo (standard runners are free there). The plan job takes seconds and
# commits nothing; a fetch commits only when a price actually changed.
on:
  schedule:
    - cron: "7,37 * * * *"    # the half-hourly check. For checks more often, e.g. every 15 minutes: "7,22,37,52 * * * *"
  workflow_dispatch:          # the website's "Refresh prices now" opens this workflow's Run button
    inputs:
      mode:
        description: "normal (PSX + MUFAP), mufap-only, backfill (first run: a year of history, ~25 minutes), probe (check PSX answers; writes nothing, no secret needed), or check (do what a scheduled check would: run only if one of the times in feed-settings.json is due; for an outside timer)"
        default: normal
        type: choice
        options: [normal, mufap-only, backfill, probe, check]
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ (steps.done.outputs['cache-hit'] == 'true' && 'false') || steps.p.outputs.run }}
      mode: ${{ steps.p.outputs.mode }}
      slot: ${{ steps.p.outputs.slot }}
      fetch_timeout: ${{ steps.p.outputs.fetch_timeout }}
      job_timeout: ${{ steps.p.outputs.job_timeout }}
      scheduled: ${{ steps.p.outputs.scheduled }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            feed-settings.json
            tools/feed_plan.py
          sparse-checkout-cone-mode: false
      - id: p
        env:
          MANUAL_MODE: ${{ inputs.mode || '' }}
        run: python3 tools/feed_plan.py
      - id: done                # has this scheduled time already run?
        if: steps.p.outputs.run == 'true' && steps.p.outputs.scheduled == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .feed-slot
          key: feed-slot-${{ steps.p.outputs.slot }}
          lookup-only: true
  fetch:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.job_timeout) }}
    concurrency:
      group: feed
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -q "cryptography>=42"
      - name: Fetch
        id: fetch
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.fetch_timeout) }}   # under the job's limit, so the commit below still runs
        continue-on-error: true
        env:
          PSX_DATA_KEY: ${{ secrets.PSX_DATA_KEY }}
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          ARGS=""
          if [ "$MODE" = "backfill" ]; then ARGS="--backfill"; fi
          if [ "$MODE" = "mufap-only" ]; then ARGS="--mufap-only"; fi
          if [ "$MODE" = "probe" ]; then ARGS="--probe"; fi
          python3 tools/web_feed.py $ARGS
      - name: Commit if changed (also after a fetch that ran out of time, so what it saved is kept)
        if: always()
        run: |
          git config user.name "feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "feed: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase --autostash -q origin main && git push -q && exit 0; sleep 5; done
          exit 1
      - name: Remember that this scheduled time ran
        if: steps.fetch.outcome == 'success' && needs.plan.outputs.scheduled == 'true'
        run: mkdir -p .feed-slot && echo "${{ needs.plan.outputs.slot }}" > .feed-slot/ran
      - if: steps.fetch.outcome == 'success' && needs.plan.outputs.scheduled == 'true'
        uses: actions/cache/save@v6
        with:
          path: .feed-slot
          key: feed-slot-${{ needs.plan.outputs.slot }}
