name: release
# Push a tag like v2.0.0 to publish psx-mufap.zip and one zip per desk skill (psx-scanner.zip, ...),
# the files people add to Claude as skills.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover tests && python tools/sync_skills.py --check
      - run: for d in psx-*; do zip -r "$d.zip" "$d" -x '*__pycache__*'; done
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" psx-*.zip --title "$GITHUB_REF_NAME" --generate-notes
