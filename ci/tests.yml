name: tests
# Free on a public repo; kept lean anyway: docs-only changes don't run it, a newer push
# cancels the older run, and no job can take longer than 10 minutes.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", "zips/**", "psx-mufap/dashboard/icons/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "psx-mufap/dashboard/icons/**"]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (offline, standard library only)
        run: python -m unittest discover -v tests
      - name: Every psx-* skill carries an up-to-date copy of the shared code
        run: python tools/sync_skills.py --check
      - name: Shell scripts parse
        run: bash -n psx-mufap/scripts/daily_sync.sh && bash -n psx-mufap/scripts/install_services.sh
